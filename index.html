<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Firma HTML - Grupo Marriott</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Generador de Firma HTML - Grupo Marriott</h1>

        <form id="signatureForm">
            <label for="name">Nombre completo:</label>
            <input type="text" id="name" placeholder="Ej: Juan Pérez" required>

            <label for="title">Cargo / Título:</label>
            <input type="text" id="title" placeholder="Ej: Gerente General" required>

            <label for="phone">Teléfono:</label>
            <input type="tel" id="phone" placeholder="Ej: +593 99 999 9999" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Ej: juan.perez@grupomarriott.com" required>

            <button type="button" id="generateBtn">Generar y Ver Firma</button>
        </form>

        <div id="previewSection" class="hidden">
            <h2>Vista Previa de tu Firma</h2>
            <div id="signaturePreview"></div>

            <button id="copyBtn">Copiar Firma al portapapeles</button>
            <div id="copyMessage">¡Firma copiada! Pégala directamente en tu cliente de correo.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
